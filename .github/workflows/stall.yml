# The daily stall check, through divbast/ci's stall.yml: a Renovate pull
# request that never goes green or never finishes, or Renovate itself
# silent. A scheduled run's failure goes to whoever last edited the cron
# line below.

name: stall

on:
  schedule:
    # Midway between two daily slots, which GitHub starts hours after
    # build.yml's 19:07 UTC. Six minutes after the LibreSpeed image's stall
    # check, so the two never start together.
    - cron: '35 12 * * *'
  workflow_dispatch:

permissions: {}

# One run at a time; a second has nothing to add to the first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  stall:
    name: stall
    uses: divbast/ci/.github/workflows/stall.yml@58ed2348852e95ccafd91c06c61f963b19769c73 # v1.25.0
    with:
      # No slots: they count the slots that should have published, and this
      # repository publishes nothing to ghcr.io. An app turns them on once
      # its first image is public: README.md's "Making a new app", step 8.
      checks: '["open","stuck","renovate"]'
    # Everything stall.yml's job asks for, slots or not: a called job that
    # asks for more than its caller grants fails.
    permissions:
      contents: read # read main, compare commits, the repository's age
      pull-requests: read # list Renovate's pull requests
      actions: read # list the Renovate and slot runs
      checks: read # read each pull request's check runs
      statuses: read # and its commit statuses
      packages: read # tell a private image from an absent one
